# MechAssault 2 -- mouse + keyboard layout (play.bat loads this file).
#
# One "bind.<KEY> = <PAD CONTROL>" per line. As soon as this file has a
# binding, it replaces the toolkit's built-in layout, so everything you want
# must be listed here. F9 releases / recaptures the mouse; F11 is fullscreen.
#
# Keys: A-Z, 0-9, F1-F12 (not F9/F11), SPACE ENTER ESC TAB BACKSPACE CAPSLOCK
#       LSHIFT RSHIFT LCTRL RCTRL LALT RALT UP DOWN LEFT RIGHT INSERT DELETE
#       HOME END PGUP PGDN COMMA PERIOD SLASH SEMICOLON QUOTE LBRACKET
#       RBRACKET BACKSLASH MINUS EQUALS GRAVE NUM0-NUM9
#       MOUSE1 (left) MOUSE2 (right) MOUSE3 (middle) MOUSE4 MOUSE5
#       WHEELUP WHEELDOWN
# Pad:  A B X Y BLACK WHITE LT RT START BACK LTHUMB RTHUMB
#       DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT
#       MOVE_FORWARD MOVE_BACK MOVE_LEFT MOVE_RIGHT   (left stick)
#       LOOK_UP LOOK_DOWN LOOK_LEFT LOOK_RIGHT        (right stick, keys)
#       NONE
#
# The game's own controls (Pause > Controls > Y):
#   left stick Move, click Jump      right stick Look, click Defense
#   right trigger Fire Weapon        left trigger Cycle Weapons
#   A Action   X Zoom (tank)   Y Enter/Exit Vehicle   B Drop Cargo (VTOL)
#   D-pad Cycle Cargo (VTOL)   White Scoreboard/Message (also: replay
#   tutorial text)   Black Toggle Global/Team Chat   Start menu

# Mouse feel. The mouse drives the Look stick.
#   sens  multiplier on the aim deflection (raise for faster turning)
#   full  mouse counts per poll for a full stick throw (lower = more sensitive)
#   dz    how much of the stick the game ignores near the centre
#   invert_y = 1 because MechAssault 2 starts with "Invert Y Axis: Yes":
#   with both, moving the mouse up looks up. If you set the game's option to
#   No, set this to 0.
sens = 1.0
full = 8
dz = 0.18
invert_y = 1

# Move and look
bind.W = MOVE_FORWARD
bind.S = MOVE_BACK
bind.A = MOVE_LEFT
bind.D = MOVE_RIGHT
bind.SPACE = LTHUMB
bind.LSHIFT = LTHUMB

# Weapons
bind.MOUSE1 = RT
bind.MOUSE2 = RTHUMB
bind.WHEELUP = LT
bind.WHEELDOWN = LT
bind.Q = LT
bind.MOUSE3 = X
bind.Z = X
bind.C = RTHUMB

# Actions
bind.E = A
bind.F = Y
bind.G = B
bind.R = B
bind.TAB = WHITE
bind.T = BLACK

# Cargo (VTOL)
bind.1 = DPAD_UP
bind.2 = DPAD_RIGHT
bind.3 = DPAD_DOWN
bind.4 = DPAD_LEFT

# Menus: arrows move, Enter selects, Backspace goes back, Esc pauses
bind.UP = DPAD_UP
bind.DOWN = DPAD_DOWN
bind.LEFT = DPAD_LEFT
bind.RIGHT = DPAD_RIGHT
bind.ENTER = A
bind.BACKSPACE = B
bind.ESC = START
bind.P = START
bind.M = BACK
